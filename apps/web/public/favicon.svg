<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vs-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c45e" />
      <stop offset="52%" stop-color="#e5a038" />
      <stop offset="100%" stop-color="#bf7414" />
    </linearGradient>
    <linearGradient id="vs-slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171d2c" />
      <stop offset="100%" stop-color="#0b0e16" />
    </linearGradient>
    <linearGradient id="vs-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe194" />
      <stop offset="100%" stop-color="#e5a038" />
    </linearGradient>
  </defs>

  <!-- Rounded cinema amber squircle badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#vs-amber)" />
  <rect
    x="26"
    y="26"
    width="460"
    height="460"
    rx="102"
    fill="none"
    stroke="#fff4d6"
    stroke-opacity="0.32"
    stroke-width="8"
  />

  <!-- Clapperboard body -->
  <rect x="88" y="196" width="336" height="224" rx="34" fill="url(#vs-slate)" />

  <!-- Top hinged clap bar (slightly tilted open for dynamic cinema silhouette) -->
  <g transform="rotate(-8 106 184)">
    <rect x="86" y="108" width="338" height="72" rx="22" fill="url(#vs-slate)" />
    <!-- Classic diagonal cinema stripes -->
    <polygon points="140,108 188,108 158,180 110,180" fill="#e5a038" />
    <polygon points="232,108 280,108 250,180 202,180" fill="#e5a038" />
    <polygon points="324,108 372,108 342,180 294,180" fill="#e5a038" />
  </g>

  <!-- Subtle slate divider bar -->
  <rect x="116" y="218" width="280" height="10" rx="5" fill="#2a3347" />

  <!-- Centered Play triangle (video production cue) -->
  <path
    d="M218 258 C218 248 229 242 238 247 L322 299 C330 304 330 316 322 321 L238 373 C229 378 218 372 218 362 Z"
    fill="url(#vs-play)"
  />
</svg>
