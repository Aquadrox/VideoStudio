x-server-common: &server-common
  build:
    context: .
    dockerfile: docker/Dockerfile.server
  restart: unless-stopped
  stop_grace_period: 60s
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - ./data:/data
    - ${INGEST_HOST_DIR:-./ingest}:/ingest:ro
    - ./skills:/skills
  networks:
    - videostudio-internal
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 6

x-server-env: &server-env
  NODE_ENV: ${NODE_ENV:-production}
  HOST: 0.0.0.0
  PORT: 3001
  DATABASE_URL: postgresql://${POSTGRES_USER:-videostudio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@postgres:5432/${POSTGRES_DB:-videostudio}
  MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required in .env}
  CORS_ORIGIN: ${CORS_ORIGIN:-*}
  DATA_DIR: /data
  INGEST_ALLOWED_DIR: /ingest
  INGEST_EXTRA_DIRS: ${INGEST_EXTRA_DIRS:-}
  SKILLS_SYNC_DIR: /skills
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
  ALLOWED_FETCH_HOSTS: ${ALLOWED_FETCH_HOSTS:-}
  COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}

x-web-common: &web-common
  build:
    context: .
    dockerfile: docker/Dockerfile.web
  restart: unless-stopped
  networks:
    - videostudio-internal
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 6

services:
  postgres:
    image: postgres:16-alpine
    container_name: videostudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videostudio}
      POSTGRES_USER: ${POSTGRES_USER:-videostudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - videostudio-internal
    # PostgreSQL is intentionally NOT exposed to the host or LAN.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videostudio} -d ${POSTGRES_DB:-videostudio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Persistent Zero-Downtime Reverse Proxy Gateway (routes to active blue or green slot)
  gateway:
    image: nginx:1.27-alpine
    container_name: videostudio-gateway
    restart: unless-stopped
    ports:
      - "0.0.0.0:${STUDIO_PORT:-3100}:80"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/gateway-entrypoint.sh:/usr/local/bin/gateway-entrypoint.sh:ro
      - ./.deploy:/etc/nginx/active-upstream
    entrypoint: ["/bin/sh", "/usr/local/bin/gateway-entrypoint.sh"]
    networks:
      - videostudio-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/gateway-healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # --- BLUE Slot (default active slot on initial boot) ---
  server-blue:
    <<: *server-common
    image: videostudio-server:blue
    container_name: videostudio-server-blue
    environment:
      <<: *server-env
      DEPLOY_SLOT: blue

  web-blue:
    <<: *web-common
    image: videostudio-web:blue
    container_name: videostudio-web-blue

  # --- GREEN Slot (standby slot activated during Blue/Green updates) ---
  server-green:
    <<: *server-common
    image: videostudio-server:green
    container_name: videostudio-server-green
    profiles: ["green"]
    environment:
      <<: *server-env
      DEPLOY_SLOT: green

  web-green:
    <<: *web-common
    image: videostudio-web:green
    container_name: videostudio-web-green
    profiles: ["green"]

volumes:
  postgres_data:

networks:
  videostudio-internal:
    driver: bridge
