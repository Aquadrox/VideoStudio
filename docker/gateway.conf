map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # Docker embedded DNS resolver so Nginx resolves only the active blue/green slot dynamically
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Dynamically switched by scripts/update.sh & scripts/rollback.sh (atomic nginx -s reload)
    include /etc/nginx/active-upstream/active-upstream.inc;

    client_max_body_size 2048M;

    # Gateway own health probe
    location = /gateway-healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-VideoStudio-Slot $active_slot;
        return 200 "ok ($active_slot)\n";
    }

    # REST API & Media Streaming (HTTP Range supported)
    location /api/ {
        proxy_pass http://$active_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header X-VideoStudio-Slot $active_slot always;
    }

    # WebSocket Realtime Hub
    location /ws {
        proxy_pass http://$active_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # MCP Streamable HTTP endpoint (Claude Code)
    location /mcp {
        proxy_pass http://$active_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        add_header X-VideoStudio-Slot $active_slot always;
    }

    # Active Web SPA Slot (blue or green)
    location / {
        proxy_pass http://$active_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-VideoStudio-Slot $active_slot always;
    }
}
